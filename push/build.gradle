apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.greenrobot.greendao'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.xiaomi.xmsf"
        minSdkVersion rootProject.ext.minSdkVersion
        // Keep alive
        targetSdkVersion rootProject.ext.targetSdkVersion
        // XMPush sdk requires XMPushService not exported, but sdk will start exported XMPushService after
        // XMSF version code 106. SDK will also check version code must >= 105.
        // @see com.xiaomi.mipush.sdk.PushServiceClient#register
        // @see com.xiaomi.mipush.sdk.PushServiceClient#createServiceIntent
        // @see com.xiaomi.mipush.sdk.PushServiceClient#getPushServiceName
        versionCode 1003003000
        versionName rootProject.ext.versionName
        archivesBaseName = "xmsf-v${versionName}"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'x86', "arm64-v8a", "x86_64"
        }

        buildConfigField "String", "GIT_TAG", "\"" + rootProject.ext.gitTag + "\""
        manifestPlaceholders = [
                mipushReceivePermission: "com.xiaomi.xmsf.permission.MIPUSH_RECEIVE"
        ]
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = true
        }
        nihility {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = true

            def locale = project.rootProject.file(".yuuta.jks")
            def keystorePwd = System.getenv("KEYSTORE_PASS")
            def alias = System.getenv("ALIAS_NAME")
            def pwd = System.getenv("ALIAS_PASS")
            if (project.rootProject.file('local.properties').exists()) {
                Properties properties = new Properties()
                properties.load(project.rootProject.file('local.properties').newDataInputStream())
                if (properties.getProperty("KEY_LOCATE") != null) {
                    locale = properties.getProperty("KEY_LOCATE")
                }
                if (properties.getProperty("KEYSTORE_PASSWORD") != null) {
                    keystorePwd = properties.getProperty("KEYSTORE_PASSWORD")
                }
                if (properties.getProperty("KEYSTORE_ALIAS") != null) {
                    alias = properties.getProperty("KEYSTORE_ALIAS")
                }
                if (properties.getProperty("KEY_PASSWORD") != null) {
                    pwd = properties.getProperty("KEY_PASSWORD")
                }
            }

            if (locale != null) {
                def keyFile = file(locale)
                if (keyFile.exists()) {
                    storeFile keyFile
                    storePassword keystorePwd
                    keyAlias alias
                    keyPassword pwd
                }
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.all {
            jvmArgs '-noverify', '-Dnet.bytebuddy.experimental=true'
        }
    }

    flavorDimensions = ["version"]
    productFlavors {
        normal {
            dimension "version"
            targetSdkVersion 34
            versionCode 1003003001
            signingConfig signingConfigs.nihility
        }
        vc105 {
            dimension "version"
            versionCode = 105
            targetSdkVersion rootProject.ext.targetSdkVersion
            signingConfig signingConfigs.nihility
        }
        prebuilt {
            dimension "version"
            targetSdkVersion rootProject.ext.targetSdkVersion
            signingConfig signingConfigs.nihility
        }
    }
    androidComponents {
        onVariants(selector().all()) { variant ->
            if(variant.name.startsWith("prebuilt")) {
                variant.androidResources.noCompress.add('dex')
            }
        }
    }

    greendao {
        // Must upgrade version code!
        schemaVersion 17
        daoPackage 'top.trumeet.mipush.provider.gen.db'
    }
    namespace 'top.trumeet.mipush.provider'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }


    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            // AGP 8.2 cannot page-align uncompressed JNI payloads for 16 KiB devices.
            // Compressing them lets PackageManager extract them with the platform's
            // native-library alignment and removes Android 15/16's compatibility dialog.
            useLegacyPackaging true
        }
    }
    composeOptions {
        // Kotlin 2.x uses the Compose compiler Gradle plugin.
    }
    namespace 'com.xiaomi.xmsf'
}

android.applicationVariants.all { variant ->
    String taskName = String.format("remove%sStubClasses", variant.name.capitalize())
    task "${taskName}" {
        doLast { delete "${buildDir}/intermediates/classes/${variant.name}" + "/android" }
    }
    variant.getProcessJavaResourcesProvider().get().dependsOn(taskName)
}

gradle.taskGraph.whenReady { taskGraph ->
    boolean requiresNihilityKey = taskGraph.allTasks.any { task ->
        String name = task.name.toLowerCase()
        (name.contains("normalrelease") || name.contains("vc105release")) &&
                (name.startsWith("assemble") || name.startsWith("package") || name.startsWith("sign"))
    }
    if (requiresNihilityKey) {
        def nihilityStore = android.signingConfigs.nihility.storeFile
        if (nihilityStore == null || !nihilityStore.exists()) {
            throw new GradleException("Official Nihility signing key (.yuuta.jks / KEY_LOCATE) is missing. Release build cannot proceed.")
        }
    }
}

dependencies {
// modules {
    implementation project(':common')
    implementation project(':condom')
    implementation project(':mipush_hook')
    compileOnly files(project(':mipush_hook').ext.mipushLib)
    implementation 'org.aspectj:aspectjrt:1.9.22.1'
// }

// feature dependencies {
    // Log
    implementation('com.elvishew:xlog:1.11.0', {
        exclude group: 'com.android.support'
    })

    implementation 'com.github.heruoxin:IceBox-SDK:55dd857d74'
    implementation 'com.google.code.gson:gson:2.10'

    // The core module that provides APIs to a shell
    implementation "com.github.topjohnwu.libsu:core:5.0.5"

    // https://mvnrepository.com/artifact/com.github.promeg/tinypinyin
    implementation 'com.github.promeg:tinypinyin:2.0.3'

    // GreenDao
    implementation 'org.greenrobot:greendao:3.3.0'
// }

// Test {
    testImplementation 'junit:junit:4.13.2'
    // Android's mockable android.jar exposes org.json methods as throwing stubs in
    // local JVM tests. Use the platform-compatible JSON implementation for parser
    // tests; this remains test-only and is never packaged into the APK.
    testImplementation 'org.json:json:20180813'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation("org.mockito:mockito-android:4.11.0")
    testImplementation("org.mockito:mockito-core:4.11.0")
    testImplementation("org.mockito:mockito-inline:4.11.0")
// }

// Base {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'


    implementation "androidx.compose.ui:ui:1.7.0"
    // Keep Material 3 available as the compatibility layer for capabilities that Miuix 0.2.9
    // does not expose, while page structure and primary controls use the Miuix components.
    implementation "androidx.compose.foundation:foundation:1.7.1"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.material:material-icons-core:1.7.1"
    implementation "top.yukonga.miuix.kmp:miuix-android:0.2.9"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.0"
    implementation "androidx.compose.ui:ui-tooling:1.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.activity:activity-compose:1.7.0"
    implementation 'androidx.navigation:navigation-compose:2.6.0'
    implementation "org.jetbrains:markdown:0.7.3"
    implementation "com.google.accompanist:accompanist-swiperefresh:0.30.1"

    // Support
    implementation 'androidx.appcompat:appcompat:1.5.0'
// }


}
